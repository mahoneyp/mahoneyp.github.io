<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — These are not the droids you are looking for</title>
  <meta name="description" content="404 Error — The page you seek is not here." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f5f5f5;
      --muted: #b3b3b3;
      --accent: #00d1ff;
      --error: #ff4d4f;
      --button-bg: #141414;
      --button-border: #2a2a2a;
      --button-hover: #1c1c1c;
      --dot: #ffffff;
      --grid-fade: 0.22;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 80% 20%, rgba(0, 209, 255, 0.08), transparent 70%) var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      min-height: 100vh;
      align-items: center;
      gap: 2rem;
      padding: clamp(24px, 4vw, 48px);
    }

    /* Left panel */
    .left {
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--error);
    }

    .eyebrow::before {
      content: "●";
      font-size: 10px;
      transform: translateY(-1px);
    }

    h1 {
      margin: 12px 0 16px 0;
      font-size: clamp(28px, 4.5vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtext {
      color: var(--muted);
      max-width: 52ch;
      margin-bottom: 28px;
      font-size: clamp(14px, 1.8vw, 16px);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--button-border);
      background: linear-gradient(180deg, var(--button-bg), #111 60%, #0c0c0c);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 100ms ease;
    }

    .btn:hover { background: var(--button-hover); border-color: #3a3a3a; }
    .btn:active { transform: translateY(1px); }

    .btn .arrow {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      position: relative;
    }

    .btn .arrow::before {
      content: "";
      position: absolute;
      left: 5px; top: 8px;
      width: 8px; height: 2px;
      background: var(--accent);
      transform: rotate(180deg);
      box-shadow: 0 0 6px rgba(0, 209, 255, 0.7);
    }

    .btn .arrow::after {
      content: "";
      position: absolute;
      left: 5px; top: 8px;
      width: 8px; height: 2px;
      background: transparent;
      border-left: 6px solid var(--accent);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transform: translate(-2px, -3px);
      filter: drop-shadow(0 0 6px rgba(0, 209, 255, 0.7));
    }

    /* Right panel: dot grid */
    .right {
      position: relative;
      min-height: 320px;
      display: grid;
      place-items: center;
    }

    .dot-grid {
      --cols: 16;
      --rows: 12;
      --gap: 16px;
      --size: 3px;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--size));
      grid-template-rows: repeat(var(--rows), var(--size));
      gap: var(--gap);
      opacity: 0.9;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.06));
    }

    .dot-grid .dot {
      width: var(--size);
      height: var(--size);
      background: rgba(255, 255, 255, var(--grid-fade));
      border-radius: 50%;
    }

    /* Subtle scan-line and vignette for sci-fi flavor */
    .right::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(transparent 97%, rgba(255, 255, 255, 0.05) 100%) 0 0 / 100% 8px,
        radial-gradient(1200px 500px at 50% 0%, rgba(0, 209, 255, 0.08), transparent 75%);
      pointer-events: none;
    }

    /* Layout polish and responsiveness */
    .footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      padding: 14px;
      font-size: 12px;
      color: #8c8c8c;
      opacity: 0.8;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .right { order: -1; min-height: 240px; }
      .dot-grid { --gap: 14px; --size: 3px; --cols: 14; --rows: 10; }
    }
    @media (max-width: 520px) {
      .dot-grid { --gap: 12px; --size: 2.8px; --cols: 12; --rows: 9; }
      .subtext { margin-bottom: 22px; }
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-labelledby="page-title">
    <section class="left">
      <div class="eyebrow" aria-hidden="true">Error</div>
      <h1 id="page-title">These are not the droids you are looking for...</h1>
      <p class="subtext">The page you’re trying to reach has gone missing in hyperspace. Check the URL or return to safety.</p>

      <div class="actions">
        <button class="btn" onclick="goHome()" aria-label="Back to home">
          <span class="arrow" aria-hidden="true"></span>
          Back to home
        </button>

        <a class="btn" href="/" aria-label="Go to site root">
          <span class="arrow" aria-hidden="true"></span>
          Go to site root
        </a>
      </div>
    </section>

    <aside class="right" aria-hidden="true">
      <div class="dot-grid" aria-hidden="true">
        <!-- 16 x 12 grid -->
        <!-- Row 1 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Repeat 12 rows -->
        <!-- Row 2 -->

        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 3 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 4 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 5 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 6 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 7 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 8 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 9 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 10 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 11 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <!-- Row 12 -->
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </aside>
  </main>

  <div class="footer" role="contentinfo">
    <span>404 — The page you seek is not here.</span>
  </div>

  <script>
    function goHome() {
      // Prefer a deterministic destination if you have a canonical homepage path.
      const home = "/";
      // If the referrer is same-origin, you can choose to go back:
      const sameOriginReferrer =
        document.referrer && new URL(document.referrer).origin === window.location.origin;

      if (sameOriginReferrer) {
        window.history.back();
      } else {
        window.location.href = home;
      }
    }
  </script>
</body>
</html>
